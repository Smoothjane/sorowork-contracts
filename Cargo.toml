[workspace]
members = [
    "contracts/bounty-escrow",
    "contracts/community-treasury",
    "contracts/contribution-registry",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/SoroWork/sorowork-contracts"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
